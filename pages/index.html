<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2230">
  <title>Games</title>
  <style>
    :root {
      --bg: #141b28;
      --ink: #f4efe4;
      --muted: #b7c0d0;
      --card: #243049;
      --line: #3a4a68;
      --sun: #f0b429;
      --moon: #8ea0ff;
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(900px 500px at -10% -20%, #4a3210, transparent 55%),
        radial-gradient(700px 480px at 110% 0%, #2a3678, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    .hero {
      position: relative;
      margin-bottom: 22px;
    }

    .orbs {
      position: absolute;
      right: 0;
      top: -6px;
      width: 92px;
      height: 56px;
      pointer-events: none;
    }
    .orbs .sun, .orbs .moon {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
    }
    .orbs .sun {
      right: 0;
      background: radial-gradient(circle at 32% 28%, #ffe58a, var(--sun) 55%, #d48900);
      box-shadow: 0 0 20px rgba(240, 180, 41, 0.45);
    }
    .orbs .moon {
      left: 8px;
      top: 16px;
      background: #3a4a8c;
      box-shadow: inset -8px -4px 0 0 #c9d0ee, 0 0 16px rgba(142, 160, 255, 0.3);
    }

    h1 {
      font-size: clamp(2rem, 8vw, 2.6rem);
      letter-spacing: -0.04em;
      margin: 0 0 8px;
    }

    .lede {
      margin: 0;
      max-width: 22em;
      color: var(--muted);
      line-height: 1.5;
      font-size: 1.02rem;
    }

    .games {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 14px;
    }

    .games a {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 14px;
      align-items: center;
      background: linear-gradient(180deg, #2d3c5c, var(--card));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 16px 40px rgba(0,0,0,0.22);
      transition: transform 0.16s ease, border-color 0.16s ease;
    }

    .games a:hover,
    .games a:focus-visible {
      transform: translateY(-3px);
      border-color: var(--sun);
    }

    .games a:focus-visible {
      outline: 2px solid var(--sun);
      outline-offset: 3px;
    }

    .mini {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .mini span {
      aspect-ratio: 1;
      border-radius: 7px;
      background: #1a2438;
      border: 1px solid #4a5c80;
    }
    .mini .s {
      background: radial-gradient(circle at 32% 28%, #ffe58a, var(--sun) 60%);
    }
    .mini .m {
      background: #3a4a8c;
      box-shadow: inset -4px -2px 0 0 #c9d0ee;
    }
    .case-mini {
      position: relative;
      height: 72px;
      border-radius: 12px;
      background: #68523b;
      border: 1px solid #80684e;
      overflow: hidden;
    }
    .case-mini span {
      position: absolute;
      width: 34px;
      height: 25px;
      padding-top: 6px;
      border-radius: 4px;
      background: #f1e6ca;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .case-mini span::before {
      content: "";
      display: block;
      width: 5px;
      height: 5px;
      margin: -3px auto 0;
      border-radius: 50%;
      background: #a33f3f;
    }
    .case-mini span:nth-child(1) { left: 7px; top: 9px; transform: rotate(-5deg); }
    .case-mini span:nth-child(2) { right: 7px; top: 13px; transform: rotate(4deg); }
    .case-mini span:nth-child(3) { left: 27px; bottom: 7px; transform: rotate(1deg); }
    .case-mini::before,
    .case-mini::after {
      content: "";
      position: absolute;
      z-index: 2;
      height: 1px;
      background: #d5ab66;
      transform-origin: left center;
    }
    .case-mini::before { width: 35px; left: 30px; top: 25px; transform: rotate(18deg); }
    .case-mini::after { width: 30px; left: 26px; top: 43px; transform: rotate(-16deg); }

    .copy h2 {
      margin: 0 0 4px;
      font-size: 1.25rem;
    }
    .copy p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .play {
      display: inline-block;
      font-weight: 800;
      font-size: 0.85rem;
      color: #1c1404;
      background: var(--sun);
      border-radius: 999px;
      padding: 6px 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      .games a { transition: none; }
      .games a:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="orbs" aria-hidden="true">
        <span class="moon"></span>
        <span class="sun"></span>
      </div>
      <h1>Games</h1>
      <p class="lede">Small static puzzles. Play in the browser. More games later.</p>
    </header>
    <ul class="games">
      <li>
        <a href="tango/">
          <div class="mini" aria-hidden="true">
            <span class="s"></span><span></span><span class="m"></span>
            <span></span><span class="m"></span><span class="s"></span>
            <span class="s"></span><span class="m"></span><span></span>
          </div>
          <div class="copy">
            <h2>Tango</h2>
            <p>A 6×6 sun and moon logic puzzle. Fill each row and column without breaking the rules.</p>
            <span class="play">Play</span>
          </div>
        </a>
      </li>
      <li>
        <a href="casebook/">
          <div class="case-mini" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div class="copy">
            <h2>Casebook</h2>
            <p>Cozy murder mysteries solved through alibis, testimony, and connected evidence.</p>
            <span class="play">Investigate</span>
          </div>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
